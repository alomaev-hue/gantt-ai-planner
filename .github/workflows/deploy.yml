name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency: deploy-prod

jobs:
  deploy:
    # Deploy only code that is on main of THIS repository:
    # - `workflow_run.branches: [main]` above filters on the triggering run's head_branch, which a
    #   fork PR opened from the fork's own `main` also matches — so the run must additionally come
    #   from a `push` event in this repository (a PR run has event `pull_request`);
    # - a manual run must be dispatched on main (the UI lets you pick any branch).
    # Second layer (external setting, see docs/runbook.md §1): the `production` environment has
    # required reviewers and the deployment branch policy `main`.
    if: >-
      (github.event_name == 'workflow_run'
       && github.event.workflow_run.conclusion == 'success'
       && github.event.workflow_run.event == 'push'
       && github.event.workflow_run.head_branch == 'main'
       && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    env:
      # The exact commit CI tested for workflow_run; the dispatched main commit otherwise.
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - id: meta
        run: echo "tag=sha-${DEPLOY_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once, load into the local Docker daemon (single-arch: the deploy
      # target is linux/amd64 only), and scan that exact image with Trivy
      # *before* anything reaches the registry. Only after the scan passes do
      # we push the already-built image — no rebuild, so the pushed bytes are
      # exactly what was scanned.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ghcr.io/alomaev-hue/gantt-ai-planner:${{ steps.meta.outputs.tag }}
            ghcr.io/alomaev-hue/gantt-ai-planner:latest

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/alomaev-hue/gantt-ai-planner:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Push scanned image to GHCR
        run: |
          docker push ghcr.io/alomaev-hue/gantt-ai-planner:${{ steps.meta.outputs.tag }}
          docker push ghcr.io/alomaev-hue/gantt-ai-planner:latest

      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          ssh -i "$key_file" \
            -o UserKnownHostsFile="$known_hosts_file" \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "$TAG"

      - name: Check production health
        run: curl -fsS https://gantt-ai-planner.duckdns.org/healthz
